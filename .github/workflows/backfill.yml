name: Backfill Historical Data

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Number of past days to backfill"
        required: true
        default: "90"

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Run backfill
        env:
          AQICN_API_KEY:       ${{ secrets.AQICN_API_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          HOPSWORKS_API_KEY:   ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT:   ${{ secrets.HOPSWORKS_PROJECT }}
          CITY_NAME:           ${{ vars.CITY_NAME }}
        run: python -m src.feature_pipeline.pipeline --backfill --days ${{ github.event.inputs.days }}

      - uses: actions/upload-artifact@v4
        with:
          name: backfill-features
          path: data/processed/features.csv
          retention-days: 30
